name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgcrypt20-dev libssl-dev

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install

      - name: Build release
        run: make release

      - name: Run tests
        run: ./dntpd -h

      - name: Check formatting
        run: clang-format --dry-run --Werror *.c *.h

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release/*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build release
        run: make release

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: dragon-ntpd
          path: dntpd
          retention-days: 7

  style:
    name: Code style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check formatting
        run: clang-format --dry-run --Werror *.c *.h
