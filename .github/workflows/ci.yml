name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build-${{ matrix.compiler }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, freebsd-latest]
        compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: gcc
          - os: macos-latest
            cc: clang
          - os: freebsd-latest
            cc: gcc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set compiler
        run: |
          case "${{ matrix.compiler }}" in
            gcc) echo "CC=gcc" >> $GITHUB_ENV ;;
            clang) echo "CC=clang" >> $GITHUB_ENV ;;
          esac

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build release
        run: make release CC=${{ env.CC }}

      - name: Build debug
        run: make clean && make debug CC=${{ env.CC }}

      - name: Build with sanitizers (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y libasan-dev libubsan-dev
          make clean && make asan CC=${{ env.CC }}
          make clean && make ubsan CC=${{ env.CC }}

      - name: Run executable test
        run: |
          echo "=== Test help ==="
          ./ntpd -h
          echo "=== Test version ==="
          ./ntpd -v

  security:
    name: Security analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CodeQL
        uses: github/codeql-action/autobuild@v3
        with:
          languages: c-cpp

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"

  analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-tools
        run: sudo apt-get update && sudo apt-get install -y clang-tools

      - name: Run clang-tidy
        run: |
          for f in *.c; do
            clang-tidy -p . "$f" -- 2>/dev/null || true
          done

  style:
    name: Code style check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check code formatting
        run: |
          unformatted=$(clang-format --dry-run --Werror *.c *.h 2>&1 || true)
          if [ -n "$unformatted" ]; then
            echo "Code style issues found:"
            echo "$unformatted"
            exit 1
          fi