name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build with ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release
        run: make release

      - name: Build debug
        run: make clean && make debug

      - name: Build with sanitizers
        run: |
          make clean && make asan
          make clean && make ubsan

      - name: Run executable test
        run: |
          echo "=== Test help ==="
          ./ntpd -h
          echo "=== Test version ==="
          ./ntpd -v

  security:
    name: Security analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CodeQL
        uses: github/codeql-action/autobuild@v3
        with:
          languages: c-cpp

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"

  analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-tools
        run: sudo apt-get update && sudo apt-get install -y clang-tools

      - name: Run clang-tidy
        run: |
          for f in *.c; do
            clang-tidy -p . "$f" -- 2>/dev/null || true
          done

  style:
    name: Code style check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check code formatting
        run: |
          unformatted=$(clang-format --dry-run --Werror *.c *.h 2>&1 || true)
          if [ -n "$unformatted" ]; then
            echo "Code style issues found:"
            echo "$unformatted"
            exit 1
          fi

  # Build for different architectures
  cross-build:
    name: Cross-compile to ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - aarch64-linux-gnu
          - arm-linux-gnueabihf
          - i686-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cross-compiler
        run: |
          case "${{ matrix.arch }}" in
            aarch64-linux-gnu) sudo apt-get install -y gcc-aarch64-linux-gnu ;;
            arm-linux-gnueabihf) sudo apt-get install -y gcc-arm-linux-gnueabihf ;;
            i686-linux-gnu) sudo apt-get install -y gcc-i686-linux-gnu ;;
          esac

      - name: Build for ${{ matrix.arch }}
        run: make release CC=${{ matrix.arch }}-gcc