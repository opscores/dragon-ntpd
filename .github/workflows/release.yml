name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Verify release branch is stable before tagging
  pre-release-check:
    name: Pre-release validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release
        run: make release

      - name: Run tests
        run: make check

      - name: Check version
        run: |
          echo "=== Version info ==="
          ./ntpd -v 2>&1 | head -3

  # Build and upload release on tag
  build-release:
    name: Build ${{ matrix.os }}-${{ matrix.compiler }}
    needs: [pre-release-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        include:
          - os: ubuntu-latest
            cc: gcc
            ext: tar.gz
          - os: ubuntu-latest
            cc: clang
            ext: tar.gz
          - os: macos-latest
            cc: gcc
            ext: tar.gz
          - os: macos-latest
            cc: clang
            ext: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set compiler
        run: |
          case "${{ matrix.compiler }}" in
            gcc) echo "CC=gcc" >> $GITHUB_ENV ;;
            clang) echo "CC=clang" >> $GITHUB_ENV ;;
          esac

      - name: Build release
        run: make release CC=${{ env.CC }}

      - name: Package
        run: |
          mkdir -p release/ntpd-${{ matrix.os }}-${{ matrix.compiler }}
          cp ntpd release/
          tar -czf release/ntpd-${{ matrix.os }}-${{ matrix.compiler }}.${{ matrix.ext }} release/ntpd-${{ matrix.os }}-${{ matrix.compiler }}/

      - name: Upload artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/ntpd-${{ matrix.os }}-${{ matrix.compiler }}.${{ matrix.ext }}
          asset_name: ntpd-${{ matrix.os }}-${{ matrix.compiler }}.${{ matrix.ext }}
          asset_content_type: application/gzip

  create-release:
    name: Create GitHub Release
    needs: [build-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: NTPD Release v${{ env.VERSION }}
          draft: false
          prerelease: false