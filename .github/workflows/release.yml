name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Verify release branch is stable before tagging
  pre-release-check:
    name: Pre-release validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release
        run: make release

      - name: Run tests
        run: make check

      - name: Check version
        run: |
          echo "=== Version info ==="
          ./dntpd -v 2>&1 | head -3

  # Build and upload release on tag
  build-release:
    name: Build with ${{ matrix.compiler }}
    needs: [pre-release-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with ${{ matrix.compiler }}
        run: |
          case "${{ matrix.compiler }}" in
            gcc) make release CC=gcc ;;
            clang) make release CC=clang ;;
          esac

      - name: Package
        run: |
          ver=${GITHUB_REF#refs/tags/v}
          mkdir -p release/dntpd-$ver-linux-${{ matrix.compiler }}
          cp dntpd release/dntpd-$ver-linux-${{ matrix.compiler }}/
          tar -czf release/dntpd-$ver-linux-${{ matrix.compiler }}.tar.gz release/dntpd-$ver-linux-${{ matrix.compiler }}/

      - name: Upload artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/dntpd-$ver-linux-${{ matrix.compiler }}.tar.gz
          asset_name: dntpd-$ver-linux-${{ matrix.compiler }}.tar.gz
          asset_content_type: application/gzip

  create-release:
    name: Create GitHub Release
    needs: [build-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: DNTPD Release v${{ env.VERSION }}
          draft: false
          prerelease: false
